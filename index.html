<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Background Color Changer</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Background Color Changer</h1>

        <p>Click any color below to change the background.</p>

        <div class="button-container">

            <button class="button" id="grey">Grey</button>

            <button class="button" id="white">White</button>

            <button class="button" id="blue">Blue</button>

            <button class="button" id="yellow">Yellow</button>

        </div>

        <p class="footer">Made with HTML, CSS & JavaScript</p>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
